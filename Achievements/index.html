<html lang="en">
<head>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0f;
      --surface: #12121f;
      --surface-hover: #1c1c32;
      --primary: #7b61ff;
      --primary-glow: rgba(123, 97, 255, 0.3);
      --primary-soft: #b8a6ff;
      --text: #eaeef2;
      --text-secondary: #9aa4b8;
      --border: #2a2a44;
      --card-bg: rgba(18, 18, 31, 0.7);
      --glass-border: rgba(123, 97, 255, 0.15);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      --glow: 0 0 30px rgba(123, 97, 255, 0.25);
      --nav-blur: 18px;
    }

    .light-mode {
      --bg: #f5f7fc;
      --surface: #ffffff;
      --surface-hover: #edf0f8;
      --primary: #5a3fd9;
      --primary-glow: rgba(90, 63, 217, 0.2);
      --primary-soft: #7b61ff;
      --text: #161b26;
      --text-secondary: #4a5568;
      --border: #dce0eb;
      --card-bg: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(90, 63, 217, 0.2);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      --glow: 0 0 30px rgba(90, 63, 217, 0.15);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.25s, color 0.2s;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 1260px;
      z-index: 1000;
      background: rgba(10, 10, 15, 0.5);
      backdrop-filter: blur(var(--nav-blur));
      -webkit-backdrop-filter: blur(var(--nav-blur));
      border-radius: 60px;
      border: 1px solid rgba(123, 97, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
      padding: 6px 16px;
      animation: navFloat 4s ease-in-out infinite;
    }

    @keyframes navFloat {
      0% { transform: translateX(-50%) translateY(0px); }
      50% { transform: translateX(-50%) translateY(-4px); }
      100% { transform: translateX(-50%) translateY(0px); }
    }

    .light-mode .navbar {
      background: rgba(245, 247, 252, 0.6);
      border-color: rgba(90, 63, 217, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }

    .navbar-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .nav-logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.3px;
    }

    .light-mode .nav-logo {
      color: var(--text);
    }

    .nav-logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(123, 97, 255, 0.3);
    }

    .nav-logo span {
      color: var(--primary-soft);
      font-weight: 400;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .theme-toggle {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      font-size: 1.1rem;
      backdrop-filter: blur(4px);
    }

    .light-mode .theme-toggle {
      background: rgba(0, 0, 0, 0.04);
      border-color: var(--border);
    }

    .theme-toggle:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      transform: scale(1.05);
    }

    /* ===== HERO ===== */
    .hero {
      min-height: 35vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 120px 20px 60px;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(rgba(123, 97, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123, 97, 255, 0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      animation: gridMove 22s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }

    .hero-content {
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeInUp 0.9s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(123, 97, 255, 0.08);
      border: 1px solid rgba(123, 97, 255, 0.2);
      border-radius: 60px;
      padding: 8px 24px;
      margin-bottom: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--primary-soft);
      backdrop-filter: blur(4px);
      letter-spacing: 0.5px;
    }

    .hero-badge .dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #22c55e;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .hero-title .gradient {
      background: linear-gradient(135deg, var(--primary) 0%, #a78bfa 50%, var(--primary-soft) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px 28px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 8px 24px var(--primary-glow);
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
    }

    .back-home:hover {
      background: #6a4feb;
      transform: translateY(-3px);
      box-shadow: 0 12px 36px var(--primary-glow);
    }

    /* ===== SECTION ===== */
    .section {
      padding: 60px 0 80px;
    }

    .section-title {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
    }

    .section-title span {
      color: var(--primary);
      font-family: 'JetBrains Mono', monospace;
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 48px;
      font-size: 1.1rem;
    }

    /* ===== STATS ===== */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      transition: all 0.3s ease;
    }

      transform: translateY(-4px);
